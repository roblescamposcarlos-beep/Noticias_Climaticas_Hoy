<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias climáticas del día</title>
<style>
  :root {
    --verde: #2e7d32;
    --verde-oscuro: #1b5e20;
    --verde-claro: #e8f5e9;
    --cielo: #e1f5fe;
    --tierra: #6d4c41;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, var(--cielo), var(--verde-claro));
    color: #263238;
    line-height: 1.55;
  }
  header {
    background: var(--verde-oscuro);
    color: #fff;
    padding: 28px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 1.9rem; }
  header p { margin: 0 auto; max-width: 720px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; }
  .panel {
    background: #fff;
    border-top: 6px solid var(--verde);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  select {
    width: 100%;
    padding: 10px;
    border: 1px solid #a5d6a7;
    border-radius: 6px;
    font: inherit;
    background: #fff;
  }
  button {
    margin-top: 14px;
    background: var(--verde);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 1.05rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--verde-oscuro); }
  button:disabled { background: #9e9e9e; cursor: not-allowed; }
  #resultados { display: none; margin-top: 20px; }
  #resultados h2 { margin: 0 0 10px; color: var(--verde-oscuro); font-size: 1.2rem; }
  #fecha { color: var(--tierra); font-weight: 400; font-size: 1rem; }
  #resultado {
    background: #fff;
    border-left: 6px solid var(--tierra);
    border-radius: 10px;
    padding: 18px;
    white-space: pre-line;
    overflow-wrap: anywhere;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  #resultado a { color: var(--verde-oscuro); }
</style>
</head>
<body>
<header>
  <h1>Noticias climáticas del día</h1>
  <p>Esta página muestra un resumen de las noticias ambientales más recientes, explicado por inteligencia artificial.</p>
</header>

<main>
  <div class="panel">
    <label for="tema">Tema</label>
    <select id="tema">
      <option>cambio climático</option>
      <option>contaminación del mar</option>
      <option>plásticos de un solo uso</option>
      <option>energías renovables México</option>
      <option>manglares Sinaloa</option>
      <option>Mazatlán medio ambiente</option>
    </select>
    <button type="button" id="boton">Ver noticias</button>
  </div>

  <div id="resultados">
    <h2>Resultados <span id="fecha"></span></h2>
    <div id="resultado" aria-live="polite"></div>
  </div>
</main>

<script>
  // Pega aquí la URL de tu webhook de Make
  const WEBHOOK_URL = "https://hook.us2.make.com/1witfot8949fb4g3kicgvtvtn1pvjq3u";

  const boton = document.getElementById("boton");
  const selector = document.getElementById("tema");
  const contenedor = document.getElementById("resultados");
  const resultado = document.getElementById("resultado");
  const fecha = document.getElementById("fecha");

  // Convierte en enlaces clicables las líneas que empiezan con http, sin interpretar HTML del texto
  function mostrarTexto(texto) {
    resultado.textContent = "";
    texto.split("\n").forEach(function (linea, i, todas) {
      const limpia = linea.trim();
      const url = limpia.match(/^\[?(https?:\/\/[^\s\]]+)/);
      if (url) {
        const a = document.createElement("a");
        a.href = url[1];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = url[1];
        resultado.appendChild(document.createTextNode(linea.slice(0, linea.indexOf(limpia))));
        resultado.appendChild(a);
      } else {
        resultado.appendChild(document.createTextNode(linea));
      }
      if (i < todas.length - 1) resultado.appendChild(document.createTextNode("\n"));
    });
  }

  boton.addEventListener("click", async function () {
    const cuerpo = new URLSearchParams();
    cuerpo.append("tema", selector.value);

    boton.disabled = true;
    contenedor.style.display = "block";
    fecha.textContent = "· " + new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
    resultado.textContent = "Buscando y resumiendo noticias...";

    try {
      const resp = await fetch(WEBHOOK_URL, { method: "POST", body: cuerpo });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      mostrarTexto(await resp.text());
    } catch (err) {
      resultado.textContent = "No se pudieron obtener las noticias, intenta de nuevo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>
</body>
</html>
